<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Magic Dust · Làm bài</title>
<style>
:root{--bg:#070b12;--panel:#0e1421;--line:rgba(120,178,165,.28);--ink:#eaf4ff;--dim:#8ba3b8;--go:#9fe8d5;--bad:#ffb4b4}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.65 ui-sans-serif,system-ui,"Segoe UI",sans-serif}
code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.92em;background:rgba(120,178,165,.14);padding:1px 5px;border-radius:4px}
header{max-width:940px;margin:0 auto;padding:46px 20px 8px}
h1{margin:0 0 6px;font-size:27px;letter-spacing:.4px}
header p{margin:0;color:var(--dim);max-width:70ch}
main{max-width:940px;margin:0 auto;padding:20px 20px 90px;display:flex;flex-direction:column;gap:20px}

.cell{border:1px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden}
.cell.pass{border-color:rgba(159,232,213,.6)}
.cell-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.cell-head h2{margin:0;font-size:16px;letter-spacing:.3px;flex:1}
.tag{font:700 10px/1 ui-monospace,monospace;letter-spacing:.8px;padding:5px 8px;border-radius:5px;color:#0b0f18;background:#5f7f92}
.tag.extra{background:#c8a24a}
.tag.done{background:var(--go)}
.cell-note{margin:0;padding:14px 16px;color:var(--dim);white-space:pre-wrap}
.cell-note code{color:var(--ink)}

.codebox{position:relative;margin:0 16px;border:1px solid var(--line);border-radius:9px;background:#050810;overflow:hidden}
.cb-paint,.cb-input{margin:0;padding:12px 14px;font:400 13px/1.6 ui-monospace,Menlo,Consolas,monospace;
  white-space:pre;overflow:auto;tab-size:4;border:0}
.cb-paint{color:var(--ink)}
.cb-input{position:absolute;inset:0;width:100%;color:transparent;background:transparent;caret-color:var(--go);resize:none;outline:none}
.cb-input::selection{background:rgba(159,232,213,.28)}
.py-k{color:#ff9ec7}.py-s{color:#ffd79a}.py-c{color:#6f8496;font-style:italic}.py-n{color:#9fe8d5}

.cell-bar{display:flex;align-items:center;gap:10px;padding:12px 16px}
button{border:0;cursor:pointer;border-radius:8px;font:700 12px/1 ui-monospace,monospace;letter-spacing:.5px;padding:10px 14px;
  color:var(--ink);background:rgba(120,178,165,.18)}
button.run{color:#0b0f18;background:var(--go)}
button:disabled{opacity:.45;cursor:not-allowed}
.verdict{flex:1;font:400 12.5px/1.5 ui-monospace,monospace;white-space:pre-wrap}
.verdict.ok{color:var(--go)}.verdict.no{color:var(--bad)}

.shots{display:flex;flex-wrap:wrap;gap:14px;padding:0 16px 16px}
.shot{display:flex;flex-direction:column;gap:6px}
.shot span{font:700 10px/1 ui-monospace,monospace;letter-spacing:.8px;color:var(--dim)}
.shot canvas{width:200px;height:150px;image-rendering:pixelated;border-radius:8px;border:1px solid var(--line);background:#050810}
table{width:calc(100% - 32px);margin:0 16px 16px;border-collapse:collapse;font:400 12.5px/1.5 ui-monospace,monospace}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
th{color:var(--dim);font-weight:400}
td.no{color:var(--bad)}td.ok{color:var(--go)}

#gate{position:sticky;bottom:0;margin-top:8px;padding:16px;border:1px solid var(--line);border-radius:14px;
  background:rgba(14,20,33,.97);backdrop-filter:blur(8px);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
#gate b{font-size:15px}
#gate .grow{flex:1}
#gate a{text-decoration:none}
#status{color:var(--dim);font:400 12.5px/1.5 ui-monospace,monospace}

/* BẢNG ĐIỂM — sinh ra để chụp màn hình gửi bố mẹ, nên nền sáng và chữ to */
#card{border-radius:16px;padding:22px 24px;background:linear-gradient(160deg,#fdfcf7,#eef4f1);color:#132029;
  border:1px solid #cfe0d8;box-shadow:0 14px 40px rgba(0,0,0,.35)}
#card h2{margin:0 0 2px;font-size:19px;letter-spacing:.3px}
#card .when{margin:0;color:#5d7280;font:400 12.5px/1.5 ui-monospace,monospace}
.card-top{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap}
.card-top .grow{flex:1}
.score{text-align:right;line-height:1}
.score b{font-size:46px;letter-spacing:-1px}
.score span{display:block;font:700 10px/1.4 ui-monospace,monospace;letter-spacing:1px;color:#5d7280}
#who{margin-top:14px;width:min(340px,100%);padding:9px 11px;border-radius:8px;border:1px solid #cfe0d8;
  background:#fff;color:#132029;font:400 14px/1.4 ui-sans-serif,system-ui,sans-serif}
.card-list{margin:16px 0 0;padding:0;list-style:none;display:grid;gap:6px 18px;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));font:400 13px/1.6 ui-monospace,monospace}
.card-list li{display:flex;gap:8px;color:#42596a}
.card-list li.on{color:#15503a;font-weight:700}
.card-note{margin:16px 0 0;font:400 12.5px/1.6 ui-sans-serif,system-ui,sans-serif;color:#5d7280}
.brief{padding:14px 16px;color:var(--dim)}
.brief .idea{margin:0 0 12px;white-space:pre-wrap}
.brief code,.cell-note code{color:var(--ink)}
.brief dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0}
.brief dt{font:700 10px/1.7 ui-monospace,monospace;letter-spacing:1px;color:#5f7f92}
.brief dd{margin:0}
.foot{margin:12px 0 0;padding-top:10px;border-top:1px dashed var(--line);font-size:13px}
.answer:empty{display:none}
.answer{margin:0 16px 14px;padding:14px;border-radius:10px;border:1px dashed rgba(200,162,74,.5);background:rgba(200,162,74,.07)}
.ans-head{margin:0 0 10px;font:700 11px/1.5 ui-monospace,monospace;letter-spacing:.6px;color:#e2c072}
.ans-code{margin:0;padding:12px;border-radius:8px;background:#050810;overflow:auto;
  font:400 12.5px/1.6 ui-monospace,Menlo,Consolas,monospace;color:var(--ink)}
.ans-why{margin:10px 0 0;color:var(--dim);font-size:13.5px}
.ans-lock{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ans-pass{padding:8px 10px;border-radius:7px;border:1px solid var(--line);background:#050810;color:var(--ink);
  font:400 13px/1.3 ui-monospace,monospace}
.ans-msg{font:400 12px/1.4 ui-monospace,monospace;color:var(--bad)}
.testcase{width:calc(100% - 32px);margin:4px 16px 16px}
.testcase th{width:130px;color:var(--dim);font-weight:400;vertical-align:top;text-align:left}
.testcase td{font:400 12px/1.5 ui-monospace,monospace;word-break:break-all}
#lab{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:18px}
#lab h2{margin:0 0 6px;font-size:17px}
.lab-note{margin:0 0 12px;color:var(--dim);font-size:13.5px}
.lab-picks{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.lab-picks button{font:400 12px/1 ui-monospace,monospace}
.lab-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.lab-msg{font:400 12.5px/1.5 ui-monospace,monospace;color:var(--dim)}
.lab-shots{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px}
.console{width:calc(100% - 32px);margin:0 16px 12px;padding:10px 12px;border-radius:8px;background:#050810;
  border:1px solid var(--line);font:400 12px/1.6 ui-monospace,Menlo,monospace;color:#9fe8d5;
  white-space:pre-wrap;max-height:150px;overflow:auto}
.console.quiet{color:#5f7f92}
.console::before{content:'MÁY IN RA';display:block;margin-bottom:6px;font:700 9.5px/1 ui-monospace,monospace;
  letter-spacing:1px;color:#5f7f92}
.shot.fx video{width:200px;height:150px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:#000}
.ans-warn{margin:0 0 10px;color:#e2c072;font-size:13px}
.ans-copy{margin-top:10px;color:#0b0f18;background:#e2c072}
.btn-preview{width:calc(100% - 32px);margin:0 16px 12px;padding:12px;border-radius:10px;
  border:1px dashed var(--line);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn-preview>span{font:700 9.5px/1 ui-monospace,monospace;letter-spacing:1px;color:#5f7f92;width:100%}
.stage-btn{color:#0b0f18;background:#9fe8d5;font:700 11px/1 ui-monospace,monospace;padding:9px 12px;border-radius:8px}
#stale{margin:10px 0 0;padding:10px 12px;border-radius:8px;background:rgba(200,162,74,.12);
  border:1px solid rgba(200,162,74,.4);color:#e2c072;font-size:13px}
#fresh{margin-top:10px;background:rgba(120,178,165,.18)}
</style>

<header>
  <h1>Xưởng Mật Ngữ — làm bài trước, ra sân khấu sau</h1>
  <p>Chín ô bên dưới, mỗi ô một hàm. Gõ vào ô, bấm CHẠY: máy chấm ngay và
  dựng luôn ẢNH VÀO / ẢNH RA bằng chính đoạn code bạn vừa viết. Sai thì sửa rồi
  chạy lại. Làm xong năm ô bắt buộc, cổng sang sân khấu thật mới mở.</p>
  <p id="status">Đang khởi động…</p>
</header>
<main id="cells"></main>

<script type="module">
// ?v= là số phiên bản. Trình duyệt coi đường dẫn khác nhau là file khác nhau,
// nên đổi số này là mọi máy nạp bản mới ngay — kể cả máy đang giữ bản cũ trong
// bộ nhớ đệm. Đã gặp thật: sau một lần cập nhật, trang chết trắng vì trình
// duyệt giữ notebook.js cũ trong 4 tiếng. Sửa file trong src/ thì bump số này.
import { mountCodeBox } from './src/highlight.js?v=4';
import { EFFECT_CLIPS } from './src/cells.js?v=4';
import { checkFresh, hardReload } from './src/fresh.js?v=4';
import { CELLS, cellSource, saveCell, publishFiles, bootPython, runCell, loadDemo, paintPixels,
         loadPassed, savePassed, scoreOf, studentName, passwordOk, baseFor, runChain,
         legacyWork } from './src/notebook.js?v=4';

const statusEl = document.getElementById('status');
const host = document.getElementById('cells');
const say = text => { statusEl.textContent = text; };
const REQUIRED = CELLS.filter(cell => !cell.extra).length;
// Điểm của lần trước còn nguyên: học sinh tắt máy đi ngủ rồi mai làm tiếp.
const passed = loadPassed();
let runtime = null, demo = null;

const views = CELLS.map(build);
const gate = buildGate();
const lab = buildLab();
const card = buildCard();
gate.update();

// Đề bài từng đổi cách biểu diễn ảnh. Máy nào còn giữ bài đời cũ thì nói thẳng,
// vì code cũ chạy trên dữ liệu mới sẽ vỡ với thông báo chẳng ai đoán ra.
// Có bản mới trên máy chủ thì tự nạp lại; kèm nút bấm tay ở đầu trang.
checkFresh(() => say('Có bản mới nhưng nạp lại chưa ăn — bấm nút ⟳ LẤY BẢN MỚI.'));
document.querySelector('header').appendChild(Object.assign(document.createElement('button'), {
  id: 'fresh', textContent: '⟳ LẤY BẢN MỚI', onclick: hardReload,
  title: 'Xoá bản cũ trong máy rồi tải lại trang',
}));

const stale = legacyWork();
if (stale.length) {
  const warn = document.createElement('p');
  warn.id = 'stale';
  warn.textContent = `Máy bạn còn ${stale.length} bài viết theo đề CŨ (ảnh phẳng px[i]): `
    + stale.join(', ') + '. Đề bài giờ dùng image[row][col], nên mấy ô đã được trả về đề mới.'
    + ' Bài cũ vẫn nằm trong máy, không mất.';
  document.querySelector('header').appendChild(warn);
}

bootPython(say)
  .then(rt => { runtime = rt; return loadDemo().catch(() => null); })
  .then(loaded => { demo = loaded; for (const view of views) view.enable(); if (!demo) say('Python sẵn sàng (không tải được ảnh demo — phần chấm vẫn chạy).'); })
  .catch(err => say(`Không tải được Python: ${err.message}`));

function build(cell) {
  const el = document.createElement('section');
  el.className = 'cell';
  el.innerHTML = `
    <div class="cell-head">
      <h2>${cell.title}</h2>
      <span class="tag ${cell.extra ? 'extra' : ''}">${cell.extra ? 'BÀI THÊM' : 'BẮT BUỘC'}</span>
    </div>
    <div class="brief">
      <p class="idea"></p>
      <dl>
        <dt>VÀO</dt><dd class="in"></dd>
        <dt>LÀM</dt><dd class="job"></dd>
        <dt>RA</dt><dd class="out"></dd>
      </dl>
    </div>
    <div class="codebox"></div>
    <div class="cell-bar">
      <button class="run" disabled>▶ CHẠY &amp; CHẤM</button>
      <button class="reset">↺ đề gốc</button>
      <button class="key">🔑 đáp án</button>
      <span class="verdict"></span>
    </div>
    <div class="answer"></div>
    <div class="shots"></div>`;
  el.querySelector('.idea').innerHTML = prose(cell.idea);
  el.querySelector('.in').innerHTML = prose(cell.input);
  el.querySelector('.job').innerHTML = prose(cell.job);
  el.querySelector('.out').innerHTML = prose(cell.output);
  if (cell.footnote) {
    const note = document.createElement('p');
    note.className = 'foot';
    note.innerHTML = prose(cell.footnote);
    el.querySelector('.brief').appendChild(note);
  }
  host.appendChild(el);

  const box = mountCodeBox(el.querySelector('.codebox'), cellSource(cell));
  const runBtn = el.querySelector('.run');
  const verdict = el.querySelector('.verdict');
  const shots = el.querySelector('.shots');

  function run() {
    saveCell(cell, box.value);
    verdict.textContent = 'đang chạy…'; verdict.className = 'verdict';
    // nhường một khung hình để chữ "đang chạy" kịp hiện trước khi Python khoá luồng
    requestAnimationFrame(() => setTimeout(() => {
      const result = runCell(runtime, cell, box.value, demo);
      verdict.textContent = (result.ok ? '✓ ' : '✖ ') + result.message;
      verdict.className = 'verdict ' + (result.ok ? 'ok' : 'no');
      el.classList.toggle('pass', result.ok);
      el.querySelector('.tag').classList.toggle('done', result.ok);
      if (result.ok) el.querySelector('.tag').textContent = 'XONG';
      if (result.ok) passed.add(cell.id); else passed.delete(cell.id);
      savePassed(passed);
      publishFiles();          // sân khấu luôn đọc được bài mới nhất, khỏi đợi mở cổng
      draw(result);
      gate.update();
      card.update();
    }, 0));
  }

  function draw(result) {
    shots.innerHTML = '';
    drawOutput(result.output);
    drawEffects(result.output);
    if (cell.kind === 'setup' && result.rows) return drawButtons(result.rows);
    if (result.rows) return drawTable(result.rows);
    if (demo && result.pixels) {
      const firstLabel = cell.id === 'blur_background' ? 'KHUNG HÌNH'
        : cell.kind === 'compose' || cell.kind === 'scene' ? 'NGƯỜI' : 'ẢNH VÀO';
      frame(firstLabel, baseFor(cell, demo));
      if (cell.kind === 'blend') frame('LỚP HIỆU ỨNG', demo.layer);
      if (cell.kind === 'over') { frame('LỚP TRÊN (nhân vật)', demo.person); frame('KÊNH ALPHA', maskPixels(demo)); }
      else if (cell.id === 'blur_background') frame('MẶT NẠ', maskPixels(demo));
      else if (cell.kind === 'compose') { frame('NỀN', demo.base); frame('MẶT NẠ', maskPixels(demo)); }
      if (cell.kind === 'scene') {
        frame('NỀN', demo.base); frame('LỚP SAU LƯNG', demo.behind);
        frame('HIỆU ỨNG TRƯỚC', demo.layer); frame('MẶT NẠ', maskPixels(demo));
      }
      frame('ẢNH RA — code của bạn dựng', result.pixels);
    }
    if (result.test?.length) drawTest(result.test);
  }

  // Bài test bằng số: học sinh thấy đúng cái máy vừa kiểm, không phải tin suông.
  function drawTest(test) {
    const [label, input, expected, got] = test;
    const table = document.createElement('table');
    table.className = 'testcase';
    const rows = [['máy đưa vào', label], ['ảnh vào', input], ['phải ra', expected], ['code bạn cho ra', got]];
    for (const [name, value] of rows) {
      const tr = document.createElement('tr');
      const th = document.createElement('th'); th.textContent = name;
      const td = document.createElement('td'); td.textContent = value;
      if (name === 'code bạn cho ra') td.className = expected === got ? 'ok' : 'no';
      tr.append(th, td); table.appendChild(tr);
    }
    shots.appendChild(table);
  }


  // Máy vừa làm gì: print() của học sinh và mọi lệnh gọi ra sân khấu.
  function drawOutput(lines) {
    const box = document.createElement('pre');
    box.className = 'console';
    box.textContent = lines?.length ? lines.join('\n')
      : '(đoạn code này không in gì và không gọi phép nào)';
    if (!lines?.length) box.classList.add('quiet');
    shots.appendChild(box);
  }


  // Mã của học sinh gọi play_effect("dragon") thì phải THẤY con rồng, chứ không
  // phải đọc dòng chữ "dragon". Mỗi phép được gọi hiện một khung video nhỏ.
  function drawEffects(lines) {
    const names = [];
    for (const line of lines || []) {
      const found = line.match(/^play_effect\("([^"]+)"\)$/);
      if (found && !names.includes(found[1])) names.push(found[1]);
    }
    for (const name of names) {
      const box = document.createElement('div');
      box.className = 'shot fx';
      const caption = document.createElement('span');
      caption.textContent = `play_effect("${name}")`;
      const video = document.createElement('video');
      if (EFFECT_CLIPS[name]) {
        video.src = EFFECT_CLIPS[name];
        video.muted = true; video.loop = true; video.playsInline = true; video.autoplay = true;
        video.play().catch(() => {});
      } else {
        caption.textContent += ' — chưa có clip cho tên này';
      }
      box.append(caption, video);
      shots.appendChild(box);
    }
  }

  function frame(label, pixels) {
    const box = document.createElement('div');
    box.className = 'shot';
    box.innerHTML = `<span>${label}</span>`;
    const canvas = document.createElement('canvas');
    box.appendChild(canvas);
    shots.appendChild(box);
    paintPixels(canvas, pixels, demo.width, demo.height);
  }


  // Ô setup: dựng NÚT THẬT y như ở sân khấu, bấm được luôn — chứ đọc bảng chữ
  // thì không biết bảng phép của mình trông ra sao.
  function drawButtons(rows) {
    const strip = document.createElement('div');
    strip.className = 'btn-preview';
    const title = document.createElement('span');
    title.textContent = 'BẢNG PHÉP CỦA BẠN — bấm thử đi';
    strip.appendChild(title);
    for (const row of rows) {
      if (!row.hit) continue;
      const name = (row.got.match(/"([^"]+)"/) || [])[1];
      const button = document.createElement('button');
      button.className = 'stage-btn';
      button.textContent = row.input;
      button.title = row.got;
      button.onclick = () => { shots.querySelectorAll('.shot.fx').forEach(box => box.remove()); drawEffects([`play_effect("${name}")`]); };
      strip.appendChild(button);
    }
    shots.appendChild(strip);
  }

  function drawTable(rows) {
    const table = document.createElement('table');
    table.innerHTML = '<tr><th>đưa vào</th><th>phải ra</th><th>code bạn cho ra</th></tr>' +
      rows.map(r => `<tr><td>${r.input}</td><td>${r.wanted}</td><td class="${r.hit ? 'ok' : 'no'}">${r.got}</td></tr>`).join('');
    shots.appendChild(table);
  }

  // Vào lại trang thì ô nào hôm qua đã xanh vẫn xanh, khỏi phải chạy lại từ đầu.
  if (passed.has(cell.id)) {
    el.classList.add('pass');
    const tag = el.querySelector('.tag');
    tag.classList.add('done'); tag.textContent = 'XONG';
    verdict.textContent = '✓ đã đạt ở lần trước — bấm CHẠY để xem lại ảnh';
    verdict.className = 'verdict ok';
  }

  runBtn.onclick = run;
  el.querySelector('.reset').onclick = () => { box.value = cell.stub; saveCell(cell, cell.stub); };
  el.querySelector('.key').onclick = () => showAnswer(cell, el.querySelector('.answer'),
    answer => { box.value = answer; saveCell(cell, answer); run(); });
  return { enable: () => { runBtn.disabled = false; } };
}

function buildGate() {
  const el = document.createElement('section');
  el.id = 'gate';
  el.innerHTML = '<b class="count"></b><span class="grow"></span><span class="hint"></span>';
  host.appendChild(el);
  const count = el.querySelector('.count'), hint = el.querySelector('.hint');

  return { update() {
    const done = CELLS.filter(cell => !cell.extra && passed.has(cell.id)).length;
    const extra = CELLS.filter(cell => cell.extra && passed.has(cell.id)).length;
    count.textContent = `${done}/${REQUIRED} bài bắt buộc${extra ? ` · ${extra} bài thêm` : ''}`;
    if (done < REQUIRED) { hint.textContent = 'Còn ô nào chưa xanh thì sửa rồi chạy lại.'; return; }
    publishFiles();
    hint.innerHTML = '<a href="./san-khau.html"><button class="run">⤳ RA SÂN KHẤU THẬT — code của bạn đi theo</button></a>';
  } };
}

// Đáp án khoá bằng mật khẩu — dành cho bố mẹ mở ra giảng khi con bí, chứ không
// phải để con bấm cho nhanh. Mở một ô thì mở luôn cả trang cho tới lúc tải lại.
let answersUnlocked = false;

function showAnswer(cell, host, onCopy) {
  if (host.dataset.open === 'yes') { host.textContent = ''; host.dataset.open = 'no'; return; }
  if (!answersUnlocked) return askPassword(host, () => showAnswer(cell, host, onCopy));
  host.dataset.open = 'yes';
  host.innerHTML = `
    <p class="ans-head">ĐÁP ÁN — dành cho bố mẹ hoặc thầy cô giảng lại</p>
    <p class="ans-warn">Đáp án này CHƯA chạy: ô bài vẫn giữ nguyên bài bạn đang gõ,
    nên dòng đúng/sai phía trên là của bài đó. Muốn thử thì bấm nút bên dưới.</p>
    <pre class="ans-code"></pre>
    <button class="ans-copy">⇥ chép vào ô rồi chạy thử</button>
    <p class="ans-why"></p>`;
  host.querySelector('.ans-code').textContent = cell.answer;
  host.querySelector('.ans-why').innerHTML = prose(cell.why);
  host.querySelector('.ans-copy').onclick = () => onCopy(cell.answer);
}

function askPassword(host, done) {
  host.dataset.open = 'no';
  host.innerHTML = `
    <p class="ans-head">Đáp án khoá lại. Nhờ bố mẹ hoặc thầy cô mở giúp nhé.</p>
    <div class="ans-lock">
      <input type="password" class="ans-pass" placeholder="mật khẩu" autocomplete="off">
      <button class="ans-go">MỞ</button>
      <span class="ans-msg"></span>
    </div>`;
  const field = host.querySelector('.ans-pass');
  const msg = host.querySelector('.ans-msg');
  const submit = () => {
    if (!passwordOk(field.value)) { msg.textContent = 'Chưa đúng.'; field.select(); return; }
    answersUnlocked = true;
    done();
  };
  host.querySelector('.ans-go').onclick = submit;
  field.onkeydown = event => { if (event.key === 'Enter') submit(); };
  field.focus();
}



// Mặt nạ là bảng SỐ, không phải bảng màu — vẽ nó ra thành ảnh xám để nhìn.
function maskPixels(demo) {
  const flat = new Array(demo.width * demo.height * 4).fill(255);
  for (let row = 0; row < demo.height; row++) {
    for (let col = 0; col < demo.width; col++) {
      const value = demo.mask[row][col];
      const at = (row * demo.width + col) * 4;
      flat[at] = value; flat[at + 1] = value; flat[at + 2] = value;
    }
  }
  return flat;
}

// XƯỞNG THỬ — bấm mấy phép mình đã viết rồi xem chúng chồng lên nhau. Đây là
// lần đầu học sinh dùng lại chính đồ mình vừa làm, thay vì chỉ nộp bài.
function buildLab() {
  const el = document.createElement('section');
  el.id = 'lab';
  el.innerHTML = `
    <h2>Xưởng thử — ghép các phép bạn vừa viết</h2>
    <p class="lab-note">Bấm chọn theo thứ tự bạn muốn máy chạy, ví dụ <code>grayscale</code>
    rồi <code>flip</code>. Ảnh ra của phép trước thành ảnh vào của phép sau.</p>
    <div class="lab-picks"></div>
    <div class="lab-bar">
      <button class="run lab-run">▶ CHẠY CHUỖI</button>
      <button class="lab-clear">↺ bỏ chọn</button>
      <span class="lab-msg"></span>
    </div>
    <div class="lab-shots"></div>`;
  host.appendChild(el);

  const picks = [];
  const picksEl = el.querySelector('.lab-picks');
  const msg = el.querySelector('.lab-msg');
  const shots = el.querySelector('.lab-shots');
  const chosen = el.querySelector('.lab-bar');

  const show = () => { msg.textContent = picks.length ? `chuỗi: ${picks.join(' → ')}` : 'chưa chọn phép nào'; };

  for (const cell of CELLS) {
    if (!['image', 'blend', 'blend_alpha', 'over', 'compose', 'scene'].includes(cell.kind)) continue;
    const button = document.createElement('button');
    button.textContent = cell.id;
    button.onclick = () => { picks.push(cell.id); show(); };
    picksEl.appendChild(button);
  }

  el.querySelector('.lab-clear').onclick = () => { picks.length = 0; show(); shots.textContent = ''; };
  el.querySelector('.lab-run').onclick = () => {
    if (!runtime || !demo) { msg.textContent = 'Python chưa sẵn sàng.'; return; }
    if (!picks.length) { msg.textContent = 'Chọn ít nhất một phép đã.'; return; }
    msg.textContent = 'đang chạy…';
    requestAnimationFrame(() => setTimeout(() => {
      const result = runChain(runtime, picks, demo);
      shots.textContent = '';
      if (!result.ok) { msg.textContent = `✖ ${result.message}`; return; }
      msg.textContent = `✓ ${picks.join(' → ')}`;
      for (const [label, pixels] of [['ẢNH BAN ĐẦU (người)', demo.person], [picks.join(' → '), result.pixels]]) {
        const box = document.createElement('div');
        box.className = 'shot';
        const caption = document.createElement('span'); caption.textContent = label;
        const canvas = document.createElement('canvas');
        box.append(caption, canvas);
        shots.appendChild(box);
        paintPixels(canvas, pixels, demo.width, demo.height);
      }
    }, 0));
  };
  show();
  return { el };
}

// Bảng điểm: nằm cuối trang, luôn hiện, để chụp màn hình gửi bố mẹ.
function buildCard() {
  const el = document.createElement('section');
  el.id = 'card';
  el.innerHTML = `
    <div class="card-top">
      <div class="grow">
        <h2>Bảng điểm — Xưởng Mật Ngữ</h2>
        <p class="when"></p>
      </div>
      <div class="score"><b></b><span>TRÊN 10</span></div>
    </div>
    <input id="who" placeholder="Gõ tên bạn vào đây" autocomplete="name">
    <ul class="card-list"></ul>
    <p class="card-note">Phần bắt buộc 7 điểm chia đều · bài thêm 3 điểm chia đều.
    Máy chấm bằng cách chạy thật đoạn code của bạn, không phải so chữ.</p>`;
  host.appendChild(el);

  const who = el.querySelector('#who');
  who.value = studentName();
  who.oninput = () => studentName(who.value);

  const list = el.querySelector('.card-list');
  const marks = new Map();
  for (const cell of CELLS) {
    const li = document.createElement('li');
    li.textContent = `○ ${cell.id}${cell.extra ? ' (thêm)' : ''}`;
    list.appendChild(li);
    marks.set(cell.id, li);
  }

  const update = () => {
    const { required, extra, points } = scoreOf(passed);
    el.querySelector('.score b').textContent = points.toFixed(1).replace('.', ',');
    el.querySelector('.when').textContent =
      `${new Date().toLocaleDateString('vi-VN')} · ${required}/${REQUIRED} bài bắt buộc · ${extra}/${CELLS.length - REQUIRED} bài thêm`;
    for (const [id, li] of marks) {
      const done = passed.has(id);
      li.classList.toggle('on', done);
      li.textContent = `${done ? '✓' : '○'} ${id}${CELLS.find(c => c.id === id).extra ? ' (thêm)' : ''}`;
    }
  };
  update();
  return { update };
}

// Chữ nghiêng thì thôi, nhưng `code` trong đề bài phải nổi lên mới đọc được.
function prose(text) {
  const safe = text.replace(/[&<>]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[ch]));
  return safe.replace(/`([^`]+)`/g, '<code>$1</code>');
}
